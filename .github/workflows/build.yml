name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and offline-contract checks
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.2"

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests and policy checks
        run: ./scripts/local-check.sh

      - name: Build the sealed Metal library twice
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          component="$(xcodebuild -showComponent MetalToolchain -json)"
          toolchain="$(jq -r '.toolchainSearchPath' <<< "$component")"
          if [[ ! -x "$toolchain/usr/bin/metallib" ]]; then
            asset="$(jq -r '.assetPath' <<< "$component")"
            dmg="$(find "$asset/Restore" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            mount="$RUNNER_TEMP/voxhearth-metal-toolchain"
            mkdir -p "$mount"
            hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount" "$dmg"
            toolchain="$mount/Metal.xctoolchain"
          fi
          export VOXHEARTH_METAL_TOOLCHAIN_ROOT="$toolchain"
          output="$RUNNER_TEMP/voxhearth-metallib-reproducibility"
          mkdir -p "$output"
          ./scripts/build-metallib.sh \
            "$output/first.metallib" "$output/first.json"
          ./scripts/build-metallib.sh \
            "$output/second.metallib" "$output/second.json"
          cmp "$output/first.metallib" "$output/second.metallib"
          cmp "$output/first.json" "$output/second.json"
          cp "$output/first.metallib" "$output/ggml-llama.metallib"
          cp "$output/first.json" "$output/manifest.json"
          cat "$output/manifest.json"

      - name: Upload the verified reproducible Metal result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-metal-verified
          path: |
            ${{ runner.temp }}/voxhearth-metallib-reproducibility/ggml-llama.metallib
            ${{ runner.temp }}/voxhearth-metallib-reproducibility/manifest.json
          if-no-files-found: error
          retention-days: 7
