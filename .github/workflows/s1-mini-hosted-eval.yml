name: S1-mini Hosted Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1-mini-hosted-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate locked S1-mini payloads
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.2"

      - name: Test source and offline policy
        run: ./scripts/local-check.sh

      - name: Fetch and verify the locked models
        run: ./scripts/fetch-models.sh

      - name: Build and verify the sealed Metal library
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          component="$(xcodebuild -showComponent MetalToolchain -json)"
          toolchain="$(jq -r '.toolchainSearchPath' <<< "$component")"
          if [[ ! -x "$toolchain/usr/bin/metallib" ]]; then
            asset="$(jq -r '.assetPath' <<< "$component")"
            dmg="$(find "$asset/Restore" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            mount="$RUNNER_TEMP/voxhearth-metal-toolchain"
            mkdir -p "$mount"
            hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount" "$dmg"
            toolchain="$mount/Metal.xctoolchain"
          fi
          export VOXHEARTH_METAL_TOOLCHAIN_ROOT="$toolchain"
          env -u SOURCE_DATE_EPOCH ./scripts/build-metallib.sh

      - name: Run privacy-safe hosted evaluation
        id: evaluation
        continue-on-error: true
        env:
          VOXHEARTH_S1_MODEL_PATH: .build/models/s1-mini-gguf/s1-mini-q4_k_m.gguf
          VOXHEARTH_S1_METALLIB_PATH: .build/s1-mini/Metal/ggml-llama.metallib
          VOXHEARTH_S1_EVAL_REPEATS: 3
          VOXHEARTH_S1_EVAL_MODE: semantic
          VOXHEARTH_S1_EVAL_DEADLINE_MS: 10000
          VOXHEARTH_S1_EVAL_OUTPUT_DIR: ${{ runner.temp }}/voxhearth-s1-evaluation
        run: ./scripts/s1-mini-eval.sh run

      - name: Upload content-free evaluation reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: s1-mini-hosted-diagnostic
          path: ${{ runner.temp }}/voxhearth-s1-evaluation/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce evaluation result
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
        run: |
          [[ "$EVALUATION_OUTCOME" == "success" ]] || {
            printf 'error: hosted S1-mini evaluation failed; inspect the content-free summary\n' >&2
            exit 1
          }
